name: Release

# Only formal v* tags create a GitHub Release (tag must equal package.json
# version). Master pushes deploy the online viewer via pages.yml instead.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC) + release provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the library (dist/) and checks the UMD legacy-syntax contract.
      - run: pnpm test

      # npm Trusted Publishing requires npm >= 11.5.1 (Node 22 ships 10.x).
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Package npm tarball
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm pack
          mv "apollo-design-docx-preview-${VERSION}.tgz" "docx-preview-${VERSION}.tgz"

      # Builds the standalone viewer into viewer-dist/.
      - run: pnpm build:viewer

      - name: Zip standalone viewer
        working-directory: viewer-dist
        run: zip -r "../docx-preview-viewer-$(node -p "require('../package.json').version").zip" .

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}" >&2
            exit 1
          fi

      # OIDC Trusted Publishing — no NPM_TOKEN. The package's Trusted
      # Publisher entry must point at this repo + this workflow file.
      - name: Publish to npm
        run: npm publish --provenance "docx-preview-$(node -p "require('./package.json').version").tgz"

      # Exactly two assets: the npm tarball and the standalone viewer zip.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            docx-preview-*.tgz
            docx-preview-viewer-*.zip
