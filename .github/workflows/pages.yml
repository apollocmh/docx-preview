name: Pages

# Deploys the standalone viewer (viewer-dist/) to GitHub Pages on every
# master push: https://apollocmh.github.io/docx-preview/
# Never creates GitHub Releases — that's release.yml's job (v* tags only).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite builds the viewer with relative asset paths (base: './'), so the
      # site works under the /docx-preview/ subpath, any static-server
      # subdirectory, and inside an iframe.
      - run: pnpm build:viewer

      # Serve the viewer at the site root (…/docx-preview/ → index.html);
      # viewer.html stays alongside for direct/iframe links.
      - name: Add site root entry
        run: cp viewer-dist/viewer.html viewer-dist/index.html

      - uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages (Actions build) on first run — otherwise the
          # step fails on repos where Pages was never turned on.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer-dist

      - id: deployment
        uses: actions/deploy-pages@v5
