name: Pages

# Deploys the docs + demos site (apps/playground: VitePress docs merged with
# the three viewer demo builds) to GitHub Pages on every master push:
# https://apollocmh.github.io/docx-preview/
# Never creates GitHub Releases — that's release.yml's job (v* tags only).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--filter playground...` builds the workspace dependencies first
      # (core lib + react/vue wrappers, whose dist the demos import), then
      # the playground itself: `vitepress build` (docs) followed by
      # `vite build` (demos merged into the same dist).
      - run: pnpm --filter playground... build

      - uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages (Actions build) on first run — otherwise the
          # step fails on repos where Pages was never turned on.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v5
