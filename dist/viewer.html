<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      iframe 嵌入用法:
      <iframe src="viewer.html?file=https://example.com/document.docx"></iframe>
      可选初始缩放: ?file=...&scale=fit | 75 | 0.75(适应宽度 / 百分比)
      可选初始侧栏: ?file=...&thumbs=1 | 0(显示 / 隐藏缩略图侧栏,默认显示)
      可选文档名:   ?file=...&filename=报告.docx(下载文件名与标题;媒体库等
                    不透明地址时由调用方显式传入)
      工具栏仅在文档加载成功后出现。
    -->
    <title>DOCX Viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header id="toolbar" class="toolbar" hidden>
        <div class="toolbar-left">
          <button id="toggle-thumbs" class="tbtn" type="button" title="缩略图">
              <svg  width="16" height="16" fill="none" viewBox="0 0 24 24">
                  <path fill="currentColor" fill-rule="evenodd" d="M21 5H11v14h10zM3 5h6v14H3zm0-2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm2 4.25a.75.75 0 0 0 0 1.5h2a.75.75 0 0 0 0-1.5zm-.75 3.5A.75.75 0 0 1 5 10h2a.75.75 0 0 1 0 1.5H5a.75.75 0 0 1-.75-.75m.75 2a.75.75 0 0 0 0 1.5h2a.75.75 0 0 0 0-1.5z" clip-rule="evenodd"></path>
              </svg>
          </button>
          <span class="toolbar-divider"></span>
          <span id="pager" class="pager">
            <button id="prev-page" class="tbtn" type="button" title="上一页">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M3 10l5-5 5 5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <span class="page-info">
              <input
                id="page-input"
                class="page-input"
                type="number"
                min="1"
                step="1"
                value="1"
                aria-label="当前页码"
              />
              <span class="page-total">/ <span id="page-total">–</span></span>
            </span>
            <button id="next-page" class="tbtn" type="button" title="下一页">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M3 6l5 5 5-5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </span>
        </div>

        <div class="toolbar-center">
          <div class="zoom-group">
            <button id="zoom-out" class="tbtn" type="button" title="缩小">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M4.8 7h4.4M10.2 10.2L14 14"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <div class="scale-select">
              <button id="scale-display" class="tbtn scale-display" type="button">
                <span id="scale-label">适应宽度</span>
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                  <path
                    d="M2 3.5l3 3 3-3"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <div id="scale-dropdown" class="dropdown" hidden>
                <button type="button" data-scale="fit" class="selected">适应宽度</button>
                <button type="button" data-scale="0.5">50%</button>
                <button type="button" data-scale="0.75">75%</button>
                <button type="button" data-scale="1">100%</button>
                <button type="button" data-scale="1.25">125%</button>
                <button type="button" data-scale="1.5">150%</button>
                <button type="button" data-scale="2">200%</button>
              </div>
            </div>
            <button id="zoom-in" class="tbtn" type="button" title="放大">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M4.8 7h4.4M7 4.8v4.4M10.2 10.2L14 14"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar-right">
          <button id="download" class="tbtn" type="button" title="下载文档">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M8 2.5V10M8 10L4.8 6.8 8 10l3.2-3.2M2.5 13.5h11"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="error-banner" class="error-banner" hidden>
        <strong id="error-title"></strong>
        <span id="error-detail"></span>
      </div>

      <div class="body">
        <aside id="thumbs" class="thumbs" hidden aria-label="页面缩略图"></aside>
        <main id="stage" class="stage">
          <div id="empty" class="empty">
            <p class="empty-title">未加载文档</p>
            <p>在地址栏传入文档地址:</p>
            <p class="empty-example">
              <code>viewer.html?file=https://example.com/document.docx</code>
            </p>
          </div>
          <div id="loading" class="loading" hidden>
            <div class="spinner"></div>
            <p>加载中…</p>
          </div>
          <div id="document" class="document"></div>
        </main>
      </div>
    </div>

    <!--
      运行时依赖:docx-preview 的 UMD 构建把 jszip 声明为外部依赖并通过全局
      JSZip 解析;jszip.min.js 是从 jszip 包原样拷贝的官方浏览器构建 ——
      全部本地自托管,无 CDN、无外网请求。
    -->
    <script src="./jszip.min.js"></script>
    <!-- 库本体,与本包 dist/ 目录下的构建产物一致。 -->
    <script src="./docx-preview.min.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
