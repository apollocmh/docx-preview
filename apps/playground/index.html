<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docx-preview playground</title>
    <style>
      body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #f3f4f6; }
      header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; }
      header label { display: flex; align-items: center; gap: 4px; color: #374151; }
      #out { padding: 24px; }
      #log { padding: 0 16px 12px; color: #6b7280; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file" accept=".docx" />
      <label><input type="checkbox" id="opt-paginate" checked /> paginate</label>
      <label><input type="checkbox" id="opt-experimental" checked /> experimental(tabs)</label>
      <span id="status">未加载</span>
    </header>
    <div id="log"></div>
    <div id="out"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
